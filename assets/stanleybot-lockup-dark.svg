<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 90" width="480" height="90">
  <defs>
    <radialGradient id="bodyGrad" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#EF7B5B"/>
      <stop offset="70%" stop-color="#E45A3B"/>
      <stop offset="100%" stop-color="#C44428"/>
    </radialGradient>
    <radialGradient id="eyeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7FFFFF"/>
      <stop offset="50%" stop-color="#00E6D2"/>
      <stop offset="100%" stop-color="#00B8A9"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Stan icon scaled to fit -->
  <g transform="translate(8, 5) scale(0.182)">
    <!-- Tentacles -->
    <path d="M145 310 Q120 350 105 380 Q95 400 110 395 Q125 390 135 360 Q140 340 150 320" fill="#C44428" opacity="0.95"/>
    <path d="M170 315 Q160 360 148 395 Q142 415 158 408 Q172 400 175 370 Q178 345 178 320" fill="#C44428" opacity="0.9"/>
    <path d="M200 320 Q200 370 198 405 Q196 425 204 425 Q212 425 210 405 Q208 370 205 320" fill="#C44428" opacity="0.95"/>
    <path d="M230 315 Q240 360 252 395 Q258 415 242 408 Q228 400 225 370 Q222 345 222 320" fill="#C44428" opacity="0.9"/>
    <path d="M255 310 Q280 350 295 380 Q305 400 290 395 Q275 390 265 360 Q260 340 250 320" fill="#C44428" opacity="0.95"/>
    <!-- Body -->
    <ellipse cx="200" cy="220" rx="110" ry="120" fill="url(#bodyGrad)"/>
    <!-- Antenna -->
    <line x1="200" y1="100" x2="200" y2="68" stroke="#C44428" stroke-width="4" stroke-linecap="round"/>
    <circle cx="200" cy="62" r="7" fill="#00E6D2" filter="url(#glow)"/>
    <circle cx="200" cy="62" r="4" fill="#7FFFFF"/>
    <!-- Eyes -->
    <ellipse cx="168" cy="215" rx="22" ry="24" fill="url(#eyeGlow)" filter="url(#glow)"/>
    <ellipse cx="168" cy="215" rx="10" ry="12" fill="#005F56"/>
    <ellipse cx="162" cy="209" rx="4" ry="5" fill="rgba(255,255,255,0.45)"/>
    <ellipse cx="232" cy="215" rx="22" ry="24" fill="url(#eyeGlow)" filter="url(#glow)"/>
    <ellipse cx="232" cy="215" rx="10" ry="12" fill="#005F56"/>
    <ellipse cx="226" cy="209" rx="4" ry="5" fill="rgba(255,255,255,0.45)"/>
    <!-- Smile -->
    <path d="M185 260 Q200 272 215 260" fill="none" stroke="rgba(0,0,0,0.2)" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <!-- Wordmark (dark variant - dark text for light backgrounds) -->
  <text x="95" y="55" font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="40" font-weight="700" letter-spacing="-1">
    <tspan fill="#1a1a2e">Stanley</tspan><tspan fill="#E45A3B">Bot</tspan>
  </text>
</svg>